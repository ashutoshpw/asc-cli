[install]
# Use exact versions for reproducible builds
exact = true

[test]
# Coverage is an explicit CI/local release gate via `bun run test:coverage`.
coverage = false
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageThreshold = { line = 0.568, function = 0.48 }

[run]
# Silence experimental warnings
silent = false
