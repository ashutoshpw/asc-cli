[install]
# Use exact versions for reproducible builds
exact = true

[test]
# Keep coverage enabled so the default test command enforces the ratchet.
coverage = true
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageThreshold = { line = 0.568, function = 0.48 }

[run]
# Silence experimental warnings
silent = false
